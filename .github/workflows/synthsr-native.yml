name: synthsr-native

on:
  pull_request:
    paths:
      - '.github/workflows/synthsr-native.yml'
      - 'exes/synthsr/**'
      - 'packages/synthsr/**'
      - 'apps/synthsr/test/fixtures/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/synthsr-native.yml'
      - 'exes/synthsr/**'
      - 'packages/synthsr/**'
      - 'apps/synthsr/test/fixtures/**'

permissions:
  contents: read

jobs:
  native-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Test native inference and release scripts
        run: make -C exes/synthsr test lint fmt
